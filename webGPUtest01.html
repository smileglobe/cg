<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLB Viewer (WebGPU)</title>
<style>
  :root { --bg:#1b1e23; --fg:#e8e6e1; --accent:#6fb3d2; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif; overflow:hidden; }
  #viewer { position:fixed; inset:0; }
  #status { position:fixed; left:16px; bottom:16px; right:16px; max-width:420px;
    font-size:14px; line-height:1.5; }
  #bar { height:4px; background:#33383f; margin-top:6px; border-radius:2px; overflow:hidden; }
  #bar > div { height:100%; width:0; background:var(--accent); transition:width .15s; }
  #status.error { color:#ff9a8a; }
  #status.done #bar { display:none; }
  #backend { position:fixed; right:16px; top:12px; font-size:12px; opacity:.6; }

  #cams { position:fixed; left:16px; top:12px; right:110px; display:flex; flex-wrap:wrap; gap:6px; }
  #cams button { display:none; font:inherit; font-size:14px; color:var(--fg); background:#2a2f36;
    border:1px solid #444b55; border-radius:6px; padding:7px 12px; cursor:pointer; }
  #cams button:hover { background:#343a43; }
  #cams button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #cams button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#10181d; }
</style>
</head>
<body>
<div id="viewer"></div>
<div id="cams" role="group" aria-label="視点切り替え">
  <button type="button" data-cam="Camera01">Camera01</button>
  <button type="button" data-cam="Camera02">Camera02</button>
  <button type="button" data-cam="Camera03">Camera03</button>
  <button type="button" data-cam="Camera04">Camera04</button>
  <button type="button" data-cam="Camera05">Camera05</button>
</div>
<div id="backend"></div>
<div id="status"><span id="msg">初期化中…</span><div id="bar"><div></div></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three/webgpu';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ===== 設定 ===== */
const DEFAULT_GLB_URL = 'https://pub-f7944d69e209414b813aafcc0d76c001.r2.dev/condo.glb'; // R2の公開URLに書き換え
const CAMERA_NAMES = ['Camera01', 'Camera02', 'Camera03', 'Camera04', 'Camera05'];
const MOVE_DURATION_MS = 900; // 視点移動にかける時間
/* ================ */

const params = new URLSearchParams(location.search);
const GLB_URL = params.get('url') || DEFAULT_GLB_URL;

const container = document.getElementById('viewer');
const statusEl = document.getElementById('status');
const msgEl = document.getElementById('msg');
const barEl = document.querySelector('#bar > div');
const buttons = [...document.querySelectorAll('#cams button')];

const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
container.appendChild(renderer.domElement);

try {
  await renderer.init();
} catch (e) {
  console.error(e);
  statusEl.classList.add('error');
  msgEl.textContent = 'レンダラーを初期化できませんでした。ブラウザの WebGPU / WebGL2 対応を確認してください。';
  throw e;
}
document.getElementById('backend').textContent =
  renderer.backend?.isWebGPUBackend ? 'WebGPU' : 'WebGL2 (fallback)';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1e23);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(3, 5, 4);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.01, 1000);
camera.position.set(2, 1.5, 3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/libs/draco/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

let mixer = null;
let tween = null;
const clock = new THREE.Clock();

function fitCameraToObject(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const dist = (maxDim / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.6;
  obj.position.sub(center);
  camera.position.set(dist * 0.7, dist * 0.5, dist);
  camera.near = maxDim / 100;
  camera.far = maxDim * 100;
  camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.update();
}

// 埋め込みカメラから「位置・向き・画角・注視点」を取り出す
function poseOf(cam, model) {
  cam.updateWorldMatrix(true, false);
  const pos = new THREE.Vector3();
  const quat = new THREE.Quaternion();
  cam.matrixWorld.decompose(pos, quat, new THREE.Vector3());
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(quat);
  const center = new THREE.Box3().setFromObject(model).getCenter(new THREE.Vector3());
  const dist = Math.max(pos.distanceTo(center), 0.1);
  return {
    pos, quat,
    target: pos.clone().addScaledVector(dir, dist),
    fov: cam.isPerspectiveCamera ? cam.fov : camera.fov,
    near: cam.near, far: cam.far,
  };
}

function moveTo(pose, animate = true) {
  camera.near = pose.near;
  camera.far = pose.far;
  if (!animate) {
    camera.position.copy(pose.pos);
    camera.quaternion.copy(pose.quat);
    camera.fov = pose.fov;
    camera.updateProjectionMatrix();
    controls.target.copy(pose.target);
    controls.update();
    return;
  }
  tween = {
    t0: performance.now(),
    from: {
      pos: camera.position.clone(),
      quat: camera.quaternion.clone(),
      fov: camera.fov,
      target: controls.target.clone(),
    },
    to: pose,
  };
}

function stepTween(now) {
  const k = Math.min((now - tween.t0) / MOVE_DURATION_MS, 1);
  const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; // easeInOutCubic
  const { from, to } = tween;
  camera.position.lerpVectors(from.pos, to.pos, e);
  camera.quaternion.slerpQuaternions(from.quat, to.quat, e);
  camera.fov = THREE.MathUtils.lerp(from.fov, to.fov, e);
  camera.updateProjectionMatrix();
  controls.target.lerpVectors(from.target, to.target, e);
  if (k >= 1) {
    tween = null;
    controls.target.copy(to.target);
    controls.update();
  }
}

msgEl.textContent = 'ダウンロード中…';
loader.load(
  GLB_URL,
  (gltf) => {
    const model = gltf.scene;
    scene.add(model);
    scene.updateMatrixWorld(true);

    // Camera01〜05 のうち、GLBに存在するものだけボタンを表示(なければ非表示のまま)
    const poses = new Map();
    for (const btn of buttons) {
      const name = btn.dataset.cam.toLowerCase();
      const cam = gltf.cameras.find((c) => (c.name || '').toLowerCase() === name);
      if (cam) {
        poses.set(btn, poseOf(cam, model));
        btn.style.display = 'block';
      }
    }

    const select = (btn, animate) => {
      buttons.forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
      moveTo(poses.get(btn), animate);
    };

    if (poses.size) {
      buttons.forEach((btn) => {
        if (poses.has(btn)) btn.addEventListener('click', () => select(btn, true));
      });
      // 初期表示: ?camera=Camera03 があればそれ、なければ最初に存在するカメラ
      const q = (params.get('camera') || '').toLowerCase();
      const first = buttons.find((b) => poses.has(b) && b.dataset.cam.toLowerCase() === q)
                 || buttons.find((b) => poses.has(b));
      select(first, false);
    } else {
      fitCameraToObject(model); // 対応カメラが無ければ自動フィット(ボタンは非表示)
    }

    if (gltf.animations.length) {
      mixer = new THREE.AnimationMixer(model);
      gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
    }
    msgEl.textContent = '';
    statusEl.classList.add('done');
  },
  (e) => {
    if (e.lengthComputable) {
      const p = Math.round((e.loaded / e.total) * 100);
      msgEl.textContent = `ダウンロード中… ${p}%`;
      barEl.style.width = p + '%';
    } else {
      msgEl.textContent = `ダウンロード中… ${(e.loaded / 1048576).toFixed(1)} MB`;
    }
  },
  (err) => {
    console.error(err);
    statusEl.classList.add('error');
    msgEl.textContent = 'GLBを読み込めませんでした。URLと、R2バケットのCORS設定を確認してください。';
  }
);

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

renderer.setAnimationLoop((now) => {
  if (mixer) mixer.update(clock.getDelta());
  if (tween) stepTween(now);   // 視点移動中はOrbitControlsの更新を止める
  else controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
