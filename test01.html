<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- 正しいmodel-viewerライブラリの読み込み -->

</head>
<body>
  <!-- すべての設定を1つのタグにまとめました -->

    src="https://pub-281458c844204a28b7739a26e30e848b.r2.dev/test01.glb"

    shadow-intensity="1" 
    shadow-softness="1"

    style="width: 100%; height: 1080px;">
