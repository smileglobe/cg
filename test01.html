<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Three.js GLB Viewer with Shadows</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #f0f0f0; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>

  <!-- 【修正】バージョンとファイルパスまで指定した正しいURL -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  let scene, camera, renderer, controls;

  function init() {
    // 1. 【ステージ作成】3D空間を作る
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);

    // 2. 【カメラ設定】見え方の範囲と位置
    camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.10, 800);
    camera.position.set(30, 10, 0);

    // 3. 【レンダラー作成】★影の有効化
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    // ★色味の補正(three.js r150以降推奨)
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    // ★ここで影を有効にしています
    
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    document.body.appendChild(renderer.domElement);

    // 4. 【マウス操作】ドラッグで回転、ホイールでズーム
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 5. 【ライト設定】★影を落とす平行光源(太陽光)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(20, 10, 6);

    // ★ライトの影を有効化
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;

    // ★影の描画範囲(修正:未設定だとモデルサイズによって影が消えることがある)
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 50;
    dirLight.shadow.camera.left = -10;
    dirLight.shadow.camera.right = 10;
    dirLight.shadow.camera.top = 10;
    dirLight.shadow.camera.bottom = -10;

    scene.add(dirLight);

    // 7. 【モデル読み込み】Cloudflare R2のGLBをインポート
    // 【修正】ここに実際の.glbファイルへの完全なURLを入れてください
    // 例: 'https://pub-xxxxxxxxxxxx.r2.dev/models/yourmodel.glb'
    const modelUrl = 'https://pub-281458c844204a28b7739a26e30e848b.r2.dev/sample.glb';

    const loader = new GLTFLoader();
    loader.load(modelUrl, function (gltf) {
      const model = gltf.scene;

      // ★モデル内のすべてのパーツに影の設定を適用
      model.traverse(function (node) {
        if (node.isMesh) {
          node.castShadow = true;
          node.receiveShadow = true;
        }
      });
      scene.add(model);
    }, undefined, function (error) {
      console.error('モデルの読み込みに失敗しました:', error);
    });

    window.addEventListener('resize', onWindowResize);
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  init();
  animate();
</script>
</body>
</html>
