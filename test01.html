<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GLB Architectural Viewer</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #eeeeee;
    }

    #viewer {
        width: 100%;
        height: 100%;
    }

    /* -----------------------------
       UI
    ----------------------------- */

    #ui {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 100;

        padding: 16px;

        background: rgba(255,255,255,0.95);
        border-radius: 10px;

        box-shadow:
            0 4px 20px rgba(0,0,0,0.15);

        min-width: 220px;
    }

    #ui h2 {
        margin: 0 0 12px 0;
        font-size: 18px;
    }

    #ui label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        color: #444;
    }

    #wallPattern {
        width: 100%;
        padding: 9px;

        border: 1px solid #cccccc;
        border-radius: 6px;

        background: white;
        font-size: 14px;

        cursor: pointer;
    }

    #resetCamera {
        width: 100%;
        margin-top: 12px;

        padding: 9px;

        border: none;
        border-radius: 6px;

        background: #333;
        color: white;

        cursor: pointer;
    }

    #resetCamera:hover {
        background: #555;
    }

    #status {
        margin-top: 10px;
        font-size: 12px;
        color: #666;
        line-height: 1.5;
    }

    #loading {
        position: fixed;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #eeeeee;

        z-index: 200;

        font-size: 16px;
        color: #444;
    }

    #error {
        position: fixed;

        top: 20px;
        right: 20px;

        max-width: 400px;

        padding: 15px;

        background: #ffdddd;
        color: #990000;

        border: 1px solid #dd9999;
        border-radius: 8px;

        z-index: 300;

        display: none;

        white-space: pre-wrap;
    }
</style>

<!-- ==========================================
     Import Map
========================================== -->

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

</head>

<body>

<div id="viewer"></div>

<!-- UI -->

<div id="ui">

    <h2>壁材変更</h2>

    <label for="wallPattern">
        テクスチャーパターン
    </label>

    <select id="wallPattern">

        <option value="A">
            パターンA
        </option>

        <option value="B">
            パターンB
        </option>

    </select>

    <button id="resetCamera">
        カメラリセット
    </button>

    <div id="status">
        GLB読み込み中...
    </div>

</div>

<div id="loading">
    3Dモデル読み込み中...
</div>

<div id="error"></div>


<script type="module">

/* =====================================================
   Three.js
===================================================== */

import * as THREE from 'three';

import { OrbitControls }
    from 'three/addons/controls/OrbitControls.js';

import { GLTFLoader }
    from 'three/addons/loaders/GLTFLoader.js';


/* =====================================================
   R2 URL設定
===================================================== */

/*
    GLB
*/

const modelUrl =
    'https://pub-281458c844204a28b7739a26e30e848b.r2.dev/sample.glb';


/*
    テクスチャーのフォルダ

    R2が

    textures/
        wall_A_01.jpg
        wall_A_02.jpg
        wall_B_01.jpg
        wall_B_02.jpg

    の構成になっている場合
*/

const textureBaseUrl =
    'https://pub-281458c844204a28b7739a26e30e848b.r2.dev/sample01Texture/';


/* =====================================================
   テクスチャーURL
===================================================== */

const textureUrls = {

    // パターンA
    A1: textureBaseUrl + 'wall_A_01.jpg',
    A2: textureBaseUrl + 'wall_A_02.jpg',

    // パターンB
    B1: textureBaseUrl + 'wall_B_01.jpg',
    B2: textureBaseUrl + 'wall_B_02.jpg'

};


/* =====================================================
   Scene
===================================================== */

const scene = new THREE.Scene();


scene.background =
    new THREE.Color(0xf2f2f2);


/* =====================================================
   Camera
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );


camera.position.set(
    7,
    8,
    7
);


/* =====================================================
   Renderer
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        alpha: false
    });


renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


/*
    影を有効化
*/

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


/*
    色空間
*/

renderer.outputColorSpace =
    THREE.SRGBColorSpace;


/*
    Tone Mapping
*/

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.0;


document
    .getElementById('viewer')
    .appendChild(renderer.domElement);


/* =====================================================
   Controls
===================================================== */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );


controls.enableDamping = true;

controls.dampingFactor = 0.05;

controls.minDistance = 1;

controls.maxDistance = 200;


/* =====================================================
   Lights
===================================================== */


/*
    Ambient Light

    数値を下げると影が濃くなる
*/

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        0.5
    );

scene.add(ambientLight);


/*
    Directional Light
*/

const dirLight =
    new THREE.DirectionalLight(
        0xffffff,
        1.0
    );


dirLight.position.set(
    20,
    30,
    20
);


dirLight.castShadow = true;


/*
    Shadow Map
*/

dirLight.shadow.mapSize.width =
    2048;

dirLight.shadow.mapSize.height =
    2048;


/*
    Shadow Camera
*/

dirLight.shadow.camera.near =
    0.5;

dirLight.shadow.camera.far =
    100;

dirLight.shadow.camera.left =
    -30;

dirLight.shadow.camera.right =
    30;

dirLight.shadow.camera.top =
    30;

dirLight.shadow.camera.bottom =
    -30;


/*
    Shadow Bias
*/

dirLight.shadow.bias =
    -0.0001;


scene.add(dirLight);


/* =====================================================
   Variables
===================================================== */

let wallMesh1 = null;
let wallMesh2 = null;

let textures = {};

let originalCameraPosition =
    new THREE.Vector3();

let originalTarget =
    new THREE.Vector3();


/* =====================================================
   UI
===================================================== */

const statusElement =
    document.getElementById('status');

const loadingElement =
    document.getElementById('loading');

const errorElement =
    document.getElementById('error');


/* =====================================================
   Error
===================================================== */

function showError(message) {

    console.error(message);

    errorElement.textContent =
        message;

    errorElement.style.display =
        'block';

}


/* =====================================================
   Texture Loader
===================================================== */

const textureLoader =
    new THREE.TextureLoader();


function loadTexture(url) {

    return new Promise(
        (resolve, reject) => {

            textureLoader.load(

                url,

                (texture) => {

                    /*
                        JPGなどのカラー画像
                    */

                    texture.colorSpace =
                        THREE.SRGBColorSpace;


                    /*
                        GLTFのUV座標に合わせる

                        Three.jsのTextureLoaderでは
                        GLTFのテクスチャーを差し替える
                        場合 flipY=false が重要
                    */

                    texture.flipY = false;


                    /*
                        繰り返し
                    */

                    texture.wrapS =
                        THREE.RepeatWrapping;

                    texture.wrapT =
                        THREE.RepeatWrapping;


                    texture.needsUpdate =
                        true;


                    resolve(texture);

                },

                undefined,

                (error) => {

                    reject(
                        new Error(
                            'テクスチャー読み込み失敗:\n' +
                            url
                        )
                    );

                }

            );

        }
    );

}


/* =====================================================
   Load All Textures
===================================================== */

async function loadTextures() {

    statusElement.textContent =
        'テクスチャー読み込み中...';


    try {

        textures.A1 =
            await loadTexture(
                textureUrls.A1
            );

        textures.A2 =
            await loadTexture(
                textureUrls.A2
            );

        textures.B1 =
            await loadTexture(
                textureUrls.B1
            );

        textures.B2 =
            await loadTexture(
                textureUrls.B2
            );


        console.log(
            'All textures loaded',
            textures
        );

    }
    catch (error) {

        showError(
            error.message
        );

        throw error;

    }

}


/* =====================================================
   Change Texture
===================================================== */

function changeWallTexture(
    mesh,
    texture
) {

    if (!mesh) {

        console.warn(
            'Wall mesh not found'
        );

        return;

    }


    if (!mesh.material) {

        console.warn(
            'Material not found:',
            mesh.name
        );

        return;

    }


    /*
        MeshStandardMaterialなど
    */

    if (
        mesh.material.isMeshStandardMaterial ||
        mesh.material.isMeshPhysicalMaterial ||
        mesh.material.isMeshPhongMaterial ||
        mesh.material.isMeshLambertMaterial
    ) {

        /*
            UVを維持したまま
            mapだけ変更
        */

        texture.flipY = false;

        texture.colorSpace =
            THREE.SRGBColorSpace;


        mesh.material.map =
            texture;


        mesh.material.needsUpdate =
            true;


        console.log(
            'Texture changed:',
            mesh.name,
            mesh.material.name
        );

    }

}


/* =====================================================
   Change Wall Pattern
===================================================== */

function setWallPattern(pattern) {

    console.log(
        'Change pattern:',
        pattern
    );


    if (!wallMesh1 || !wallMesh2) {

        console.warn(
            'Wall mesh is not ready'
        );

        return;

    }


    /*
        =========================
        Pattern A
        =========================

        Wall_01
        ↓
        wall_A_01.jpg

        Wall_02
        ↓
        wall_A_02.jpg
    */

    if (pattern === 'A') {

        changeWallTexture(
            wallMesh1,
            textures.A1
        );

        changeWallTexture(
            wallMesh2,
            textures.A2
        );

    }


    /*
        =========================
        Pattern B
        =========================

        Wall_01
        ↓
        wall_B_01.jpg

        Wall_02
        ↓
        wall_B_02.jpg
    */

    if (pattern === 'B') {

        changeWallTexture(
            wallMesh1,
            textures.B1
        );

        changeWallTexture(
            wallMesh2,
            textures.B2
        );

    }


    statusElement.textContent =
        '現在のパターン：' +
        pattern;

}


/* =====================================================
   GLB Loader
===================================================== */

const gltfLoader =
    new GLTFLoader();


async function loadModel() {

    statusElement.textContent =
        '3Dモデル読み込み中...';


    return new Promise(
        (resolve, reject) => {

            gltfLoader.load(

                modelUrl,

                (gltf) => {

                    const model =
                        gltf.scene;


                    console.log(
                        'GLB loaded'
                    );


                    /*
                        =================================
                        Mesh確認
                        =================================
                    */

                    model.traverse(
                        (object) => {

                            if (!object.isMesh) {
                                return;
                            }


                            /*
                                影
                            */

                            object.castShadow =
                                true;

                            object.receiveShadow =
                                true;


                            /*
                                Mesh / Materialを
                                Consoleに表示
                            */

                            console.log(
                                'MESH:',
                                object.name,
                                'MATERIAL:',
                                object.material?.name,
                                'UV:',
                                !!object.geometry
                                    .attributes
                                    .uv
                            );


                            /*
                                =============================
                                Wall_01
                                =============================
                            */

                            if (
                                object.name ===
                                'Wall_01'
                            ) {

                                wallMesh1 =
                                    object;

                                console.log(
                                    'Wall_01 FOUND',
                                    object
                                );

                            }


                            /*
                                =============================
                                Wall_02
                                =============================
                            */

                            if (
                                object.name ===
                                'Wall_02'
                            ) {

                                wallMesh2 =
                                    object;

                                console.log(
                                    'Wall_02 FOUND',
                                    object
                                );

                            }

                        }
                    );


                    /*
                        モデルをSceneへ
                    */

                    scene.add(model);


                    /*
                        Wall確認
                    */

                    console.log(
                        'wallMesh1:',
                        wallMesh1
                    );

                    console.log(
                        'wallMesh2:',
                        wallMesh2
                    );


                    /*
                        カメラ自動調整
                    */

                    fitCameraToObject(
                        model
                    );


                    /*
                        初期カメラ保存
                    */

                    originalCameraPosition.copy(
                        camera.position
                    );

                    originalTarget.copy(
                        controls.target
                    );


                    resolve(
                        model
                    );

                },

                (progress) => {

                    if (
                        progress.total > 0
                    ) {

                        const percent =
                            (
                                progress.loaded /
                                progress.total
                            ) * 100;


                        statusElement.textContent =
                            'GLB読み込み中... ' +
                            percent.toFixed(0) +
                            '%';

                    }

                },

                (error) => {

                    reject(
                        new Error(
                            'GLB読み込み失敗:\n' +
                            modelUrl
                        )
                    );

                }

            );

        }
    );

}


/* =====================================================
   Camera Fit
===================================================== */

function fitCameraToObject(
    object
) {

    const box =
        new THREE.Box3()
            .setFromObject(object);


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    const maxSize =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    const fitHeightDistance =
        maxSize /
        (
            2 *
            Math.tan(
                THREE.MathUtils.degToRad(
                    camera.fov * 0.5
                )
            )
        );


    const fitWidthDistance =
        fitHeightDistance /
        camera.aspect;


    const distance =
        1.2 *
        Math.max(
            fitHeightDistance,
            fitWidthDistance
        );


    /*
        カメラ位置
    */

    camera.position.set(
        center.x + distance,
        center.y + distance * 0.6,
        center.z + distance
    );


    /*
        注視点
    */

    controls.target.copy(
        center
    );


    camera.near =
        Math.max(
            0.01,
            distance / 100
        );


    camera.far =
        distance * 100;


    camera.updateProjectionMatrix();

    controls.update();

}


/* =====================================================
   Camera Reset
===================================================== */

document
    .getElementById('resetCamera')
    .addEventListener(
        'click',
        () => {

            camera.position.copy(
                originalCameraPosition
            );

            controls.target.copy(
                originalTarget
            );

            controls.update();

        }
    );


/* =====================================================
   Pattern Change Event
===================================================== */

document
    .getElementById('wallPattern')
    .addEventListener(
        'change',
        (event) => {

            setWallPattern(
                event.target.value
            );

        }
    );


/* =====================================================
   Window Resize
===================================================== */

window.addEventListener(
    'resize',
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   Animation
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    controls.update();


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   Start
===================================================== */

async function init() {

    try {

        /*
            1. GLB
        */

        await loadModel();


        /*
            2. テクスチャー
        */

        await loadTextures();


        /*
            3. 初期パターンA
        */

        setWallPattern('A');


        /*
            完了
        */

        loadingElement.style.display =
            'none';


        statusElement.textContent =
            'パターンA';


        /*
            Wall確認
        */

        if (!wallMesh1) {

            console.warn(
                'Wall_01 が見つかりません'
            );

        }

        if (!wallMesh2) {

            console.warn(
                'Wall_02 が見つかりません'
            );

        }

    }
    catch (error) {

        console.error(
            error
        );


        loadingElement.style.display =
            'none';


        showError(
            error.message ||
            '読み込み中にエラーが発生しました。'
        );

    }

}


init();

</script>

</body>
</html>
