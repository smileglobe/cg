<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Three.js GLB Viewer with Shadows</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #f0f0f0; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>

  <!-- 【修正】タイムアウト対策として、接続の安定した unpkg CDN に変更 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com",
        "three/addons/": "https://unpkg.com"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  let scene, camera, renderer, controls;

  function init() {
    // 1. 【ステージ作成】3D空間を作る
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);

    // 2. 【カメラ設定】見え方の範囲と位置
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3, 5);

    // 3. 【レンダラー作成】影の有効化
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    // 色味の補正(three.js r150以降推奨)
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    // 影を有効化
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    document.body.appendChild(renderer.domElement);

    // 4. 【マウス操作】ドラッグで回転、ホイールでズーム
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 5. 【ライト設定】環境光のみ配置（平行光源はGLBから読み込むため削除）
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    // 6. 【モデル読み込み】Cloudflare R2のGLBをインポート
    const modelUrl = 'https://r2.dev';

    const loader = new GLTFLoader();
    loader.load(modelUrl, function (gltf) {
      const model = gltf.scene;

      // モデル内のすべての要素（メッシュやライト）を走査して設定を適用
      model.traverse(function (node) {
        // メッシュ（3Dオブジェクト・内蔵床）への影設定
        if (node.isMesh) {
          node.castShadow = true;
          node.receiveShadow = true;
        }

        // ★GLB内に含まれる平行光源（DirectionalLight）を見つけて影を設定
        if (node.isDirectionalLight) {
          node.castShadow = true;
          node.shadow.mapSize.width = 2048;
          node.shadow.mapSize.height = 2048;

          // 影の描画範囲（モデルのサイズに合わせて調整してください）
          node.shadow.camera.near = 0.5;
          node.shadow.camera.far = 50;
          node.shadow.camera.left = -10;
          node.shadow.camera.right = 10;
          node.shadow.camera.top = 10;
          node.shadow.camera.bottom = -10;
          
          // 影が不自然にギザギザしたり欠けたりする場合の微調整用
          node.shadow.bias = -0.0005; 
        }
      });
      
      scene.add(model);
    }, undefined, function (error) {
      console.error('モデルの読み込みに失敗しました:', error);
    });

    window.addEventListener('resize', onWindowResize);
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  init();
  animate();
</script>
</body>
</html>
