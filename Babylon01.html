<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Babylon.js GLB Viewer</title>
    <!-- Babylon.js CDN からライブラリを読み込み -->
    <script src="//cdn.babylonjs.com/babylon.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* UI スタイル */
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: sans-serif; color: #333; pointer-events: none;
        }
        .controls-info {
            position: absolute; bottom: 10px; right: 10px;
            background: rgba(255, 255, 255, 0.9); padding: 10px; border-radius: 4px;
            font-size: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div id="loading">Loading Model...</div>
<!-- ここに Canvas は JS で生成されます -->

<script>
// --- 設定部分 ---
const MODEL_URL = 'https://pub-281458c844204a28b7739a26e30e848b.r2.dev/sample.glb'; // Cloudflare の URL に変更してください
const TEXTURE_DIR = ''; // テクスチャがある場合のディレクトリパス (空の場合は不要)

async function createScene() {
    const engine = new BABYLON.Engine(document.body, true, { preserveDrawingBuffer: false, stencil: false });
    const canvas = document.querySelector('canvas');

    // シーン作成
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.9, 0.9, 0.9, 1); // 背景色（グリッドが見えるように白）

    // ライティング設定
    scene.environmentTextureLoader.loadEnvironmentTexture("env", "https://raw.githubusercontent.com/BabylonJS/WebSamples/master/BasicLightingAndShadows/assets/environment.jpg");
    const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
    light.intensity = 0.7;

    // グRID プラン（床）を追加してスケール感を把握しやすくする
    const gridHelper = new BABYLON.GridHelper(scene, 10, "#cccccc", "#ffffff");
    
    // カメラ設置
    const camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 2, Math.PI / 2.5, 6, new BABYLON.Vector3(0, 0, 0), scene);
    camera.attachControl(canvas, true);
    camera.wheelPrecision = 50;

    // GLB ローダーの設定
    const glbLoader = new BABYLON.GLBLoader();
    
    try {
        // モデルを読み込む
        await glbLoader.load(MODEL_URL, null, scene);
        
        // 読み込み完了時の処理
        document.getElementById('loading').style.display = 'none';

        // アニメーションループ開始
        scene.registerBeforeRender(() => {
            if (!scene.isPaused && !scene.isStopped) {
                // ここでモデルのアニメーションや更新ロジックを書く
            }
        });

        window.addEventListener("resize", () => {
            engine.resize();
        }, false);

    } catch (error) {
        console.error("GLB Loading Error:", error);
        alert(`モデルの読み込みに失敗しました。\nエラー詳細：${error.message}\nCORS エラーが発生している場合は、Cloudflare の CORS 設定を確認してください。`);
    }
}

// アプリケーション起動
createScene().catch(err => {
    console.error("Failed to create scene or load model:", err);
});
</script>

<!-- UI コンテナ -->
<div class="controls-info">
    <strong>操作方法:</strong><br>
    マウスドラッグ: 回転<br>
    スクロール: ズーム<br>
    Shift+ ドラッグ: パン
</div>

</body>
</html>
