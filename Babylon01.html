<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon.js 3D Model Viewer</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #333333;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
    <!-- Babylon.js Core と Loader の読み込み -->
    <script src="https://babylonjs.com"></script>
    <script src="https://babylonjs.com"></script>
</head>
<body>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);

            // 背景色の設定
            scene.clearColor = new BABYLON.Color4(0.2, 0.2, 0.2, 1);

            // カメラの設定（モデルを中心にマウスやタッチで回転可能）
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 5, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);

            // ライト（照明）の設定
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.7;

            // ─── 【重要】Cloudflare上の3Dモデル読み込み設定 ───
            // TODO: あなたのCloudflareのURLとファイル名に書き換えてください
            const fileUrl = "https://pub-281458c844204a28b7739a26e30e848b.r2.dev/sample.glb"; 
            const fileName = "sample.glb"; 

            // 3Dモデルのインポート
            BABYLON.SceneLoader.ImportMesh("", fileUrl, fileName, scene, function (meshes) {
                // モデルが読み込まれたら、カメラのターゲットをモデルの中心に自動調整
                if (meshes.length > 0) {
                    const boundingInfo = meshes[0].getHierarchyBoundingVectors();
                    // 必要に応じてカメラの注視点や距離を自動最適化することも可能です
                }
            }, null, function (scene, message, exception) {
                console.error("モデルの読み込みに失敗しました:", message, exception);
            });

            return scene;
        };

        const scene = createScene();

        // 描画ループの実行
        engine.runRenderLoop(function () {
            scene.render();
        });

        // ブラウザのサイズ変更に対応
        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
