<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>Babylon.js GLB Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; z-index: 999; background: rgba(255,255,255,0.8); padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="info">Cloudflare GLB ファイルを表示中</div>

    <!-- Babylon.js と Loaders を CDN から読み込む -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylon.loaders.min.js"></script>

    <script>
        // 1. シーンとエンジンを作成
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            
            // 背景色を設定
            scene.clearColor = new BABYLON.Color4(0.2, 0.2, 0.3, 1);
            
            // カメラを作成
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 5, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);

            // ライトを設定
            const directionalLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
            directionalLight.intensity = 0.5;

            return scene;
        };

        // 2. Cloudflare 上の GLB ファイルの URL を設定
        const glbUrl = "https://pub-281458c844204a28b7739a26e30e848b.r2.dev/sample.glb";

        // 3. GLB ファイルを読み込む
        BABYLON.SceneLoader.ImportMeshAsync("", "", glbUrl, createScene())
            .then(function (result) {
                console.log("モデルが正常に読み込まれました");
                result.meshes.forEach((mesh, index) => {
                    mesh.name = "Model_" + index;
                });
            })
            .catch(function (error) {
                console.error("読み込みエラー:", error);
            });

        // 4. エンジンを実行
        window.addEventListener("load", function () {
            engine.runRenderLoop(function () {
                scene.render();
            });
            
            // ウィンドウリサイズ対応
            window.addEventListener("resize", function () {
                engine.resize();
            });
        });
    </script>
</body>
</html>
