<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon.js 3D Model Viewer</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #333333;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
    <!-- 【修正】信頼性の高い cdnjs から読み込むように変更しました -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <canvas id="renderCanvas"></canvas>

    <script>
        window.addEventListener('DOMContentLoaded', function () {
            
            if (typeof BABYLON === 'undefined') {
                console.error("cdnjs からの読み込みもブロックされました。修正方法2を試してください。");
                return;
            }

            const canvas = document.getElementById("renderCanvas");
            const engine = new BABYLON.Engine(canvas, true);

            const createScene = function () {
                const scene = new BABYLON.Scene(engine);
                scene.clearColor = new BABYLON.Color4(0.2, 0.2, 0.2, 1);

                // カメラの初期位置を調整（少し引いた位置に設定）
                const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 10, BABYLON.Vector3.Zero(), scene);
                camera.attachControl(canvas, true);

                const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
                light.intensity = 0.7;

                // Cloudflare上の3Dモデル設定
                const fileUrl = "https://your-cloudflare-r2-or-pages-url.com"; 
                const fileName = "your-model.glb"; 

                BABYLON.SceneLoader.ImportMesh("", fileUrl, fileName, scene, function (meshes) {
                    // モデルが小さすぎたり大きすぎたりした時のために、自動でカメラ位置を合わせる
                    scene.createDefaultCameraOrLight(true, true, true);
                }, null, function (scene, message, exception) {
                    console.error("モデルの読み込みに失敗しました:", message, exception);
                });

                return scene;
            };

            const scene = createScene();

            engine.runRenderLoop(function () {
                scene.render();
            });

            window.addEventListener("resize", function () {
                engine.resize();
            });
        });
    </script>
</body>
</html>
