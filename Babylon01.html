<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon.js 3D Model Viewer</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #333333;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
    <!-- Babylon.js Core と Loader の読み込み -->
    <script src="https://babylonjs.com"></script>
    <script src="https://babylonjs.com"></script>
</head>
<body>

    <canvas id="renderCanvas"></canvas>

    <script>
        // ─── 修正ポイント ───
        // 画面の読み込み（ライブラリのロード）が完全に終わってから実行する
        window.addEventListener('DOMContentLoaded', function () {
            
            // ここでBABYLONが定義されているか安全確認
            if (typeof BABYLON === 'undefined') {
                console.error("Babylon.js が正常に読み込めませんでした。ネット接続やURLを確認してください。");
                return;
            }

            const canvas = document.getElementById("renderCanvas");
            const engine = new BABYLON.Engine(canvas, true);

            const createScene = function () {
                const scene = new BABYLON.Scene(engine);
                scene.clearColor = new BABYLON.Color4(0.2, 0.2, 0.2, 1);

                const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 5, BABYLON.Vector3.Zero(), scene);
                camera.attachControl(canvas, true);

                const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
                light.intensity = 0.7;

                // Cloudflare上の3Dモデル設定（ご自身の環境に合わせて変更してください）
                const fileUrl = "https://your-cloudflare-r2-or-pages-url.com"; 
                const fileName = "your-model.glb"; 

                BABYLON.SceneLoader.ImportMesh("", fileUrl, fileName, scene, function (meshes) {
                    if (meshes.length > 0) {
                        // 読み込み成功時の処理
                    }
                }, null, function (scene, message, exception) {
                    console.error("モデルの読み込みに失敗しました:", message, exception);
                });

                return scene;
            };

            const scene = createScene();

            engine.runRenderLoop(function () {
                scene.render();
            });

            window.addEventListener("resize", function () {
                engine.resize();
            });
        });
    </script>
</body>
</html>
