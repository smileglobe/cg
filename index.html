<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Three.js GLB Viewer</title>

    <style>

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            padding: 15px 25px;

            background: rgba(0,0,0,0.7);
            color: white;

            font-family: Arial, sans-serif;

            border-radius: 5px;
        }

    </style>

</head>


<body>

<div id="loading">
    GLB Loading...
</div>


<script type="module">

import * as THREE from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

import { OrbitControls } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

import { GLTFLoader } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


// ============================================================
// GLB URL
// ============================================================

const modelUrl =
    'https://pub-281458c844204a28b7739a26e30e848b.r2.dev/sample.glb';


// ============================================================
// Scene
// ============================================================

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0xeeeeee);


// ============================================================
// Camera
// ============================================================

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        10000
    );

camera.position.set(
    10,
    8,
    10
);


// ============================================================
// Renderer
// ============================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);


// Shadow
renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


// Color
renderer.outputColorSpace =
    THREE.SRGBColorSpace;


// Tone Mapping
renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.0;


document.body.appendChild(
    renderer.domElement
);


// ============================================================
// Ambient Light
// ============================================================

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        0.6
    );

scene.add(
    ambientLight
);


// ============================================================
// Directional Light
// ============================================================

const dirLight =
    new THREE.DirectionalLight(
        0xffffff,
        2.0
    );

dirLight.position.set(
    20,
    20,
    10
);

dirLight.castShadow = true;


// Shadow Map
dirLight.shadow.mapSize.width =
    2048;

dirLight.shadow.mapSize.height =
    2048;


// Shadow Camera
dirLight.shadow.camera.near =
    0.1;

dirLight.shadow.camera.far =
    200;

dirLight.shadow.camera.left =
    -50;

dirLight.shadow.camera.right =
    50;

dirLight.shadow.camera.top =
    50;

dirLight.shadow.camera.bottom =
    -50;


// Shadow Bias
dirLight.shadow.bias =
    -0.0001;


scene.add(
    dirLight
);

scene.add(
    dirLight.target
);


// ============================================================
// OrbitControls
// ============================================================

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping =
    true;


// ============================================================
// GLTF Loader
// ============================================================

const loader =
    new GLTFLoader();


// ============================================================
// GLB Load
// ============================================================

console.log(
    'GLB Loading:',
    modelUrl
);


loader.load(

    modelUrl,


    // --------------------------------------------------------
    // SUCCESS
    // --------------------------------------------------------

    function(gltf) {

        console.log(
            'GLB LOAD SUCCESS'
        );

        console.log(
            gltf
        );


        const model =
            gltf.scene;


        // ----------------------------------------------------
        // Mesh設定
        // ----------------------------------------------------

        model.traverse(function(object) {

            if (object.isMesh) {

                object.castShadow =
                    true;

                object.receiveShadow =
                    true;


                console.log(
                    'Mesh:',
                    object.name
                );


                if (object.material) {

                    console.log(
                        'Material:',
                        object.material.name
                    );

                }

            }

        });


        // ----------------------------------------------------
        // Sceneへ追加
        // ----------------------------------------------------

        scene.add(
            model
        );


        // ----------------------------------------------------
        // モデルサイズ取得
        // ----------------------------------------------------

        const box =
            new THREE.Box3()
                .setFromObject(model);


        const size =
            box.getSize(
                new THREE.Vector3()
            );


        const center =
            box.getCenter(
                new THREE.Vector3()
            );


        console.log(
            'Model Size:',
            size
        );

        console.log(
            'Model Center:',
            center
        );


        // ----------------------------------------------------
        // 最大サイズ
        // ----------------------------------------------------

        const maxSize =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        // ----------------------------------------------------
        // Camera
        // ----------------------------------------------------

        const distance =
            maxSize * 2;


        camera.position.set(

            center.x + distance,

            center.y + distance * 0.7,

            center.z + distance

        );


        camera.near =
            Math.max(
                maxSize / 1000,
                0.01
            );

        camera.far =
            maxSize * 100;

        camera.updateProjectionMatrix();


        // ----------------------------------------------------
        // Controls
        // ----------------------------------------------------

        controls.target.copy(
            center
        );

        controls.update();


        // ----------------------------------------------------
        // Light Target
        // ----------------------------------------------------

        dirLight.target.position.copy(
            center
        );


        // ----------------------------------------------------
        // Shadow Camera
        // ----------------------------------------------------

        const shadowSize =
            Math.max(
                maxSize * 1.5,
                10
            );


        dirLight.shadow.camera.left =
            -shadowSize;

        dirLight.shadow.camera.right =
            shadowSize;

        dirLight.shadow.camera.top =
            shadowSize;

        dirLight.shadow.camera.bottom =
            -shadowSize;

        dirLight.shadow.camera.far =
            Math.max(
                maxSize * 5,
                50
            );


        dirLight.shadow.camera.updateProjectionMatrix();


        // ----------------------------------------------------
        // Loading終了
        // ----------------------------------------------------

        document.getElementById(
            'loading'
        ).style.display =
            'none';


    },


    // --------------------------------------------------------
    // PROGRESS
    // --------------------------------------------------------

    function(xhr) {

        if (xhr.total > 0) {

            const percent =
                xhr.loaded /
                xhr.total *
                100;

            document.getElementById(
                'loading'
            ).textContent =
                'GLB Loading... ' +
                percent.toFixed(1) +
                '%';

        }

    },


    // --------------------------------------------------------
    // ERROR
    // --------------------------------------------------------

    function(error) {

        console.error(
            'GLB LOAD ERROR'
        );

        console.error(
            error
        );


        document.getElementById(
            'loading'
        ).textContent =
            'GLB LOAD ERROR';


    }

);


// ============================================================
// Resize
// ============================================================

window.addEventListener(
    'resize',
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


// ============================================================
// Animation
// ============================================================

function animate() {

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>

</html>
