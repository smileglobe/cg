<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Three.js R2 GLB Viewer</title>


    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #eeeeee;

        }

        canvas {

            display: block;

        }

        #loading {

            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            padding: 15px 25px;

            background:
                rgba(0, 0, 0, 0.75);

            color: white;

            font-family:
                Arial,
                sans-serif;

            border-radius: 6px;

            z-index: 1000;

        }

    </style>


    <!-- =====================================================
         ★ Import Map
    ====================================================== -->

    <script type="importmap">

    {
        "imports": {

            "three":
                "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

            "three/addons/":
                "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

        }
    }

    </script>

</head>


<body>


<div id="loading">
    GLB Loading...
</div>


<script type="module">


// ============================================================
// Three.js
// ============================================================

import * as THREE from 'three';


// ============================================================
// OrbitControls
// ============================================================

import { OrbitControls } from
    'three/addons/controls/OrbitControls.js';


// ============================================================
// GLTFLoader
// ============================================================

import { GLTFLoader } from
    'three/addons/loaders/GLTFLoader.js';


// ============================================================
// GLB URL
// ============================================================

const modelUrl =
    'https://pub-281458c844204a28b7739a26e30e848b.r2.dev/sample.glb';


// ============================================================
// Scene
// ============================================================

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0xeeeeee);


// ============================================================
// Camera
// ============================================================

const camera =
    new THREE.PerspectiveCamera(

        45,

        window.innerWidth /
        window.innerHeight,

        0.1,

        10000

    );


// 仮の位置
camera.position.set(
    30,
    10,
    0
);


// ============================================================
// Renderer
// ============================================================

const renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });


renderer.setSize(

    window.innerWidth,
    window.innerHeight

);


renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        2
    )

);


// ============================================================
// Shadow
// ============================================================

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


// ============================================================
// Color Management
// ============================================================

renderer.outputColorSpace =
    THREE.SRGBColorSpace;


// ============================================================
// Tone Mapping
// ============================================================

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.0;


// ============================================================
// Canvas
// ============================================================

document.body.appendChild(

    renderer.domElement

);


// ============================================================
// Ambient Light 数値を下げると影が濃くなる。
// ============================================================

const ambientLight =
    new THREE.AmbientLight(

        0xffffff,

        0.3

    );

scene.add(

    ambientLight

);


// ============================================================
// Directional Light
// ============================================================

const dirLight =
    new THREE.DirectionalLight(

        0xffffff,

        2.5

    );


dirLight.position.set(

    20,
    20,
    10

);


// 影を有効化
dirLight.castShadow = true;


// ============================================================
// Shadow Map
// ============================================================

dirLight.shadow.mapSize.width =
    2048;

dirLight.shadow.mapSize.height =
    2048;


// ============================================================
// Shadow Camera
// ============================================================

dirLight.shadow.camera.near =
    0.1;

dirLight.shadow.camera.far =
    200;

dirLight.shadow.camera.left =
    -50;

dirLight.shadow.camera.right =
    50;

dirLight.shadow.camera.top =
    50;

dirLight.shadow.camera.bottom =
    -50;


// Shadow Bias
dirLight.shadow.bias =
    -0.0001;


scene.add(

    dirLight

);

scene.add(

    dirLight.target

);


// ============================================================
// OrbitControls
// ============================================================

const controls =
    new OrbitControls(

        camera,
        renderer.domElement

    );


controls.enableDamping =
    true;

controls.dampingFactor =
    0.05;


// ============================================================
// GLTFLoader
// ============================================================

const loader =
    new GLTFLoader();


// ============================================================
// GLB Loading
// ============================================================

console.log(
    'Loading GLB:',
    modelUrl
);


loader.load(

    modelUrl,


    // ========================================================
    // SUCCESS
    // ========================================================

    function(gltf) {


        console.log(
            '================================'
        );

        console.log(
            'GLB LOAD SUCCESS'
        );

        console.log(
            '================================'
        );


        const model =
            gltf.scene;


        // ====================================================
        // Mesh設定
        // ====================================================

        model.traverse(

            function(object) {


                if (
                    object.isMesh
                ) {


                    // 影を落とす
                    object.castShadow =
                        true;


                    // 影を受ける
                    object.receiveShadow =
                        true;


                    console.log(
                        'Mesh:',
                        object.name
                    );


                    // Material確認
                    if (
                        object.material
                    ) {

                        console.log(
                            'Material:',
                            object.material.name
                        );

                    }

                }

            }

        );


        // ====================================================
        // Sceneへ追加
        // ====================================================

        scene.add(

            model

        );


        // ====================================================
        // Bounding Box
        // ====================================================

        const box =
            new THREE.Box3()
                .setFromObject(model);


        const size =
            box.getSize(

                new THREE.Vector3()

            );


        const center =
            box.getCenter(

                new THREE.Vector3()

            );


        console.log(
            'Model Size:',
            size
        );


        console.log(
            'Model Center:',
            center
        );


        // ====================================================
        // 最大サイズ
        // ====================================================

        const maxSize =
            Math.max(

                size.x,
                size.y,
                size.z

            );


        // ====================================================
        // Camera
        // ====================================================

        const distance =
            maxSize * 2;


        camera.position.set(

            center.x + distance,

            center.y +
                distance * 0.7,

            center.z + distance

        );


        camera.near =
            Math.max(

                maxSize / 1000,

                0.01

            );


        camera.far =
            maxSize * 100;


        camera.updateProjectionMatrix();


        // ====================================================
        // OrbitControls
        // ====================================================

        controls.target.copy(

            center

        );


        controls.update();


        // ====================================================
        // Light Target
        // ====================================================

        dirLight.target.position.copy(

            center

        );


        // ====================================================
        // Shadow Camera自動調整
        // ====================================================

        const shadowSize =
            Math.max(

                maxSize * 1.5,

                10

            );


        dirLight.shadow.camera.left =
            -shadowSize;


        dirLight.shadow.camera.right =
            shadowSize;


        dirLight.shadow.camera.top =
            shadowSize;


        dirLight.shadow.camera.bottom =
            -shadowSize;


        dirLight.shadow.camera.far =
            Math.max(

                maxSize * 5,

                50

            );


        dirLight.shadow.camera.updateProjectionMatrix();


        // ====================================================
        // Loading終了
        // ====================================================

        document.getElementById(
            'loading'
        ).style.display =
            'none';


    },


    // ========================================================
    // Progress
    // ========================================================

    function(xhr) {


        if (
            xhr.total > 0
        ) {


            const percent =
                xhr.loaded /
                xhr.total *
                100;


            document.getElementById(
                'loading'
            ).textContent =

                'GLB Loading... ' +
                percent.toFixed(1) +
                '%';


        }

    },


    // ========================================================
    // ERROR
    // ========================================================

    function(error) {


        console.error(
            '================================'
        );

        console.error(
            'GLB LOAD ERROR'
        );

        console.error(
            error
        );

        console.error(
            '================================'
        );


        document.getElementById(
            'loading'
        ).textContent =
            'GLB LOAD ERROR';


    }

);


// ============================================================
// Resize
// ============================================================

window.addEventListener(

    'resize',

    function() {


        camera.aspect =

            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );


    }

);


// ============================================================
// Animation
// ============================================================

function animate() {


    requestAnimationFrame(

        animate

    );


    controls.update();


    renderer.render(

        scene,
        camera

    );

}


animate();


</script>


</body>

</html>
