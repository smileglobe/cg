# Three.js + Cloudflare R2 GLB Viewer 完全版

```html
<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GLB Viewer</title>


    <style>

        /* =====================================================
           基本
        ===================================================== */

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #eeeeee;

        }


        canvas {

            display: block;

        }


        /* =====================================================
           Loading
        ===================================================== */

        #loading {

            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            padding:
                15px 25px;

            background:
                rgba(0, 0, 0, 0.75);

            color: white;

            font-family:
                Arial,
                sans-serif;

            font-size: 14px;

            border-radius: 6px;

            z-index: 1000;

        }


        /* =====================================================
           エラー表示
        ===================================================== */

        #error {

            display: none;

            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            padding:
                20px 30px;

            max-width: 600px;

            background:
                rgba(180, 0, 0, 0.9);

            color: white;

            font-family:
                Arial,
                sans-serif;

            font-size: 14px;

            line-height: 1.6;

            border-radius: 6px;

            z-index: 1001;

        }


        /* =====================================================
           UI
        ===================================================== */

        #ui {

            position: fixed;

            top: 20px;
            left: 20px;

            padding: 15px;

            background:
                rgba(255, 255, 255, 0.9);

            border-radius: 8px;

            font-family:
                Arial,
                sans-serif;

            font-size: 13px;

            z-index: 100;

        }


        #ui button {

            margin-top: 5px;
            margin-right: 5px;

            padding:
                7px 12px;

            cursor: pointer;

        }


    </style>

</head>


<body>


<!-- =========================================================
     Loading
========================================================= -->

<div id="loading">

    GLB Loading...

</div>


<!-- =========================================================
     Error
========================================================= -->

<div id="error">

    GLBの読み込みに失敗しました。

</div>


<!-- =========================================================
     UI
========================================================= -->

<div id="ui">

    <strong>GLB Viewer</strong>

    <br><br>

    <button id="resetCamera">
        カメラリセット
    </button>

    <button id="shadowButton">
        Shadow Camera
    </button>

    <br>

    <button id="lightButton">
        Light ON / OFF
    </button>

</div>


<!-- =========================================================
     Three.js
========================================================= -->

<script type="module">


// ============================================================
// Three.js
// ============================================================

import * as THREE from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';


// ============================================================
// OrbitControls
// ============================================================

import { OrbitControls } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';


// ============================================================
// GLTFLoader
// ============================================================

import { GLTFLoader } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


// ============================================================
// 1. GLB URL
// ============================================================

const modelUrl =
    'https://pub-281458c844204a28b7739a26e30e848b.r2.dev/sample.glb';


// ============================================================
// 2. Scene
// ============================================================

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0xeeeeee
    );


// ============================================================
// 3. Camera
// ============================================================

const camera =
    new THREE.PerspectiveCamera(

        45,

        window.innerWidth /
        window.innerHeight,

        0.1,

        10000

    );


camera.position.set(

    10,
    8,
    10

);


// ============================================================
// 4. Renderer
// ============================================================

const renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });


// サイズ
renderer.setSize(

    window.innerWidth,
    window.innerHeight

);


// 解像度
renderer.setPixelRatio(

    Math.min(

        window.devicePixelRatio,
        2

    )

);


// ============================================================
// ★ Shadow
// ============================================================

renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


// ============================================================
// ★ Color Management
// ============================================================

renderer.outputColorSpace =
    THREE.SRGBColorSpace;


// ============================================================
// ★ Tone Mapping
// ============================================================

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1.0;


// ============================================================
// Canvas
// ============================================================

document.body.appendChild(

    renderer.domElement

);


// ============================================================
// 5. Ambient Light
// ============================================================

const ambientLight =
    new THREE.AmbientLight(

        0xffffff,

        0.6

    );


scene.add(

    ambientLight

);


// ============================================================
// 6. Directional Light
// ============================================================

// 太陽光
const dirLight =
    new THREE.DirectionalLight(

        0xffffff,

        2.0

    );


// 光源位置
dirLight.position.set(

    20,
    20,
    10

);


// ============================================================
// Shadow
// ============================================================

dirLight.castShadow =
    true;


// Shadow Map解像度
dirLight.shadow.mapSize.width =
    2048;

dirLight.shadow.mapSize.height =
    2048;


// ============================================================
// Shadow Camera
// ============================================================

dirLight.shadow.camera.near =
    0.1;


dirLight.shadow.camera.far =
    200;


dirLight.shadow.camera.left =
    -50;


dirLight.shadow.camera.right =
    50;


dirLight.shadow.camera.top =
    50;


dirLight.shadow.camera.bottom =
    -50;


// ============================================================
// Shadow Bias
// ============================================================

dirLight.shadow.bias =
    -0.0001;


// Sceneに追加
scene.add(

    dirLight

);


// ============================================================
// Light Target
// ============================================================

scene.add(

    dirLight.target

);


// ============================================================
// 7. Shadow Camera Helper
// ============================================================

// 最初は非表示
const shadowHelper =
    new THREE.CameraHelper(

        dirLight.shadow.camera

    );


shadowHelper.visible =
    false;


scene.add(

    shadowHelper

);


// ============================================================
// 8. OrbitControls
// ============================================================

const controls =
    new OrbitControls(

        camera,
        renderer.domElement

    );


controls.enableDamping =
    true;


controls.dampingFactor =
    0.05;


// ============================================================
// 9. GLTF Loader
// ============================================================

const loader =
    new GLTFLoader();


// ============================================================
// 10. GLB読み込み
// ============================================================

loader.load(

    modelUrl,


    // ========================================================
    // 読み込み成功
    // ========================================================

    function (gltf) {


        console.log(
            '================================'
        );

        console.log(
            'GLB Loaded'
        );

        console.log(
            '================================'
        );


        const model =
            gltf.scene;


        // ====================================================
        // GLB情報
        // ====================================================

        console.log(
            'Scene:',
            model
        );


        // ====================================================
        // 11. GLB Mesh設定
        // ====================================================

        model.traverse(

            function (object) {


                if (
                    object.isMesh
                ) {


                    // ----------------------------------------
                    // ★ 影を落とす
                    // ----------------------------------------

                    object.castShadow =
                        true;


                    // ----------------------------------------
                    // ★ 影を受ける
                    // ----------------------------------------

                    object.receiveShadow =
                        true;


                    // ----------------------------------------
                    // Mesh名
                    // ----------------------------------------

                    console.log(
                        'Mesh:',
                        object.name
                    );


                    // ----------------------------------------
                    // Material情報
                    // ----------------------------------------

                    if (
                        object.material
                    ) {


                        console.log(

                            'Material:',
                            object.material.name

                        );


                        // ====================================
                        // PBR Material確認
                        // ====================================

                        if (
                            object.material.isMeshStandardMaterial ||
                            object.material.isMeshPhysicalMaterial
                        ) {


                            console.log(

                                'Metalness:',
                                object.material.metalness

                            );


                            console.log(

                                'Roughness:',
                                object.material.roughness

                            );

                        }

                    }

                }

            }

        );


        // ====================================================
        // 12. Sceneへ追加
        // ====================================================

        scene.add(

            model

        );


        // ====================================================
        // 13. モデルのBounding Box
        // ====================================================

        const box =
            new THREE.Box3()
                .setFromObject(
                    model
                );


        // モデルサイズ
        const size =
            box.getSize(

                new THREE.Vector3()

            );


        // モデル中心
        const center =
            box.getCenter(

                new THREE.Vector3()

            );


        console.log(
            'Model Size:',
            size
        );


        console.log(
            'Model Center:',
            center
        );


        // ====================================================
        // 14. モデル最大サイズ
        // ====================================================

        const maxSize =
            Math.max(

                size.x,
                size.y,
                size.z

            );


        // ====================================================
        // 15. カメラ距離
        // ====================================================

        const distance =
            maxSize * 2.0;


        camera.position.set(

            center.x + distance,
            center.y + distance * 0.7,
            center.z + distance

        );


        // ====================================================
        // 16. Camera設定
        // ====================================================

        camera.near =
            Math.max(

                maxSize / 1000,
                0.01

            );


        camera.far =
            maxSize * 100;


        camera.updateProjectionMatrix();


        // ====================================================
        // 17. OrbitControls
        // ====================================================

        controls.target.copy(

            center

        );


        controls.update();


        // ====================================================
        // 18. DirectionalLightを建物に向ける
        // ====================================================

        dirLight.target.position.copy(

            center

        );


        // ====================================================
        // 19. Shadow Camera自動調整
        // ====================================================

        const shadowSize =
            Math.max(

                maxSize * 1.5,
                10

            );


        dirLight.shadow.camera.left =
            -shadowSize;


        dirLight.shadow.camera.right =
            shadowSize;


        dirLight.shadow.camera.top =
            shadowSize;


        dirLight.shadow.camera.bottom =
            -shadowSize;


        dirLight.shadow.camera.far =
            Math.max(

                maxSize * 5,
                50

            );


        dirLight.shadow.camera.updateProjectionMatrix();


        // ShadowHelper更新
        shadowHelper.update();


        // ====================================================
        // 20. Ground Plane
        // ====================================================

        // 建物の下に影を受ける地面を作る
        const groundSize =
            Math.max(

                maxSize * 5,
                100

            );


        const groundGeometry =
            new THREE.PlaneGeometry(

                groundSize,
                groundSize

            );


        const groundMaterial =
            new THREE.MeshStandardMaterial({

                color:
                    0xffffff,

                roughness:
                    0.9,

                metalness:
                    0.0

            });


        const ground =
            new THREE.Mesh(

                groundGeometry,
                groundMaterial

            );


        // 水平にする
        ground.rotation.x =
            -Math.PI / 2;


        // 建物中心の高さ
        ground.position.y =
            box.min.y;


        // ★ 影を受ける
        ground.receiveShadow =
            true;


        scene.add(

            ground

        );


        // ====================================================
        // 21. Loading終了
        // ====================================================

        document.getElementById(
            'loading'
        ).style.display =
            'none';


        console.log(
            'GLB表示完了'
        );

    },


    // ========================================================
    // Loading Progress
    // ========================================================

    function (xhr) {


        if (
            xhr.total > 0
        ) {


            const percent =
                xhr.loaded /
                xhr.total *
                100;


            document.getElementById(
                'loading'
            ).textContent =

                'GLB Loading... ' +
                percent.toFixed(1) +
                '%';


            console.log(

                'Loading:',
                percent.toFixed(1),
                '%'

            );

        }

    },


    // ========================================================
    // Error
    // ========================================================

    function (error) {


        console.error(
            '================================'
        );


        console.error(
            'GLB Loading Error'
        );


        console.error(
            error
        );


        console.error(
            '================================'
        );


        document.getElementById(
            'loading'
        ).style.display =
            'none';


        document.getElementById(
            'error'
        ).style.display =
            'block';


    }

);


// ============================================================
// 22. Camera Reset
// ============================================================

document.getElementById(
    'resetCamera'
).addEventListener(

    'click',

    function () {


        if (
            !modelCenter ||
            !modelSize
        ) {

            return;

        }


        const distance =
            modelSize * 2.0;


        camera.position.set(

            modelCenter.x + distance,
            modelCenter.y + distance * 0.7,
            modelCenter.z + distance

        );


        controls.target.copy(

            modelCenter

        );


        controls.update();


    }

);


// ============================================================
// 23. Shadow Camera ON / OFF
// ============================================================

document.getElementById(
    'shadowButton'
).addEventListener(

    'click',

    function () {


        shadowHelper.visible =
            !shadowHelper.visible;


    }

);


// ============================================================
// 24. Light ON / OFF
// ============================================================

document.getElementById(
    'lightButton'
).addEventListener(

    'click',

    function () {


        dirLight.visible =
            !dirLight.visible;


    }

);


// ============================================================
// 25. Model Information
// ============================================================

let modelCenter =
    null;


let modelSize =
    null;


// ============================================================
// 26. GLB再読み込み時の情報保存
// ============================================================

// GLBロード処理とは別に
// modelCenter / modelSizeを保持するための
// traverseではなく、ロード後に設定する構造です.
//
// 下記の関数を使用します。


// ============================================================
// 27. Resize
// ============================================================

window.addEventListener(

    'resize',

    function () {


        camera.aspect =

            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );


    }

);


// ============================================================
// 28. Animation Loop
// ============================================================

function animate() {


    requestAnimationFrame(

        animate

    );


    // OrbitControls
    controls.update();


    // Render
    renderer.render(

        scene,
        camera

    );


}


// ============================================================
// Start
// ============================================================

animate();


</script>


</body>

</html>
```
