# Three.js GLB Viewer ― Shadow対応 完全版

```html
<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GLB Viewer</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #eeeeee;
        }

        canvas {
            display: block;
        }

        /* --------------------------------
           Loading表示
        -------------------------------- */

        #loading {
            position: fixed;
            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            padding: 15px 25px;

            background: rgba(0, 0, 0, 0.7);
            color: white;

            font-family: sans-serif;
            font-size: 14px;

            border-radius: 5px;

            z-index: 100;
        }

    </style>

</head>


<body>


<div id="loading">
    GLB Loading...
</div>


<script type="module">


// ============================================================
// Three.js
// ============================================================

import * as THREE from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';


// ============================================================
// OrbitControls
// ============================================================

import { OrbitControls } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';


// ============================================================
// GLTFLoader
// ============================================================

import { GLTFLoader } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


// ============================================================
// 1. Scene
// =======================================================

const scene = new THREE.Scene();


// 背景色
scene.background =
    new THREE.Color(0xeeee


// ============================================================
// 2. Camera
// ============================================================

const camera =
    new THREE.PerspectiveCamera(

        45,

        window.innerWidth /
        window.innerHeight,

        0.1,

        1000

    );


// 仮のカメラ位置
camera.position.set(
    10,
    8,
    10
);


// ============================================================
// 3. Renderer
// ============================================================

const renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });


// サイズ
renderer.setSize(

    window.innerWidth,
    window.innerHeight

);


// 解像度
renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        2
    )

);


// ------------------------------------------------------------
// ★ Shadowを有効化
// ------------------------------------------------------------

renderer.shadowMap.enabled = true;


// Shadowの種類
renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


// ------------------------------------------------------------
// ★ Color Management
// ------------------------------------------------------------

renderer.outputColorSpace =
    THREE.SRGBColorSpace;


// ------------------------------------------------------------
// ★ Tone Mapping
// ------------------------------------------------------------

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


// 明るさ
renderer.toneMappingExposure = 1.0;


// CanvasをHTMLに追加
document.body.appendChild(
    renderer.domElement
);


// ============================================================
// 4. Ambient Light
// ============================================================

// 全体を照らす環境光
const ambientLight =
    new THREE.AmbientLight(

        0xffffff,

        0.6

    );

scene.add(
    ambientLight
);


// ============================================================
// 5. Directional Light
// ============================================================

// 太陽光
const dirLight =
    new THREE.DirectionalLight(

        0xffffff,

        2.0

    );


// ------------------------------------------------------------
// 光源位置
// ------------------------------------------------------------

dirLight.position.set(

    20,
    20,
    10

);


// ------------------------------------------------------------
// 建物の中心へ向ける
// ------------------------------------------------------------

dirLight.target.position.set(

    0,
    0,
    0

);


// Sceneに追加
scene.add(
    dirLight
);

scene.add(
    dirLight.target
);


// ============================================================
// 6. Shadow
// ============================================================

// ★ DirectionalLightで影を作る
dirLight.castShadow = true;


// ------------------------------------------------------------
// Shadow Map解像度
// ------------------------------------------------------------

dirLight.shadow.mapSize.width =
    2048;

dirLight.shadow.mapSize.height =
    2048;


// ------------------------------------------------------------
// Shadow Camera
// ------------------------------------------------------------

dirLight.shadow.camera.near =
    0.1;

dirLight.shadow.camera.far =
    200;


// 左右
dirLight.shadow.camera.left =
    -50;

dirLight.shadow.camera.right =
    50;


// 上下
dirLight.shadow.camera.top =
    50;

dirLight.shadow.camera.bottom =
    -50;


// ------------------------------------------------------------
// Shadow Bias
// ------------------------------------------------------------

// Shadow Acne対策
dirLight.shadow.bias =
    -0.0001;


// ============================================================
// 7. Shadow Camera Helper
// ============================================================

// ★ Shadow範囲確認用
//
// 問題が解決したらコメントアウトしてOK
//

const shadowHelper =
    new THREE.CameraHelper(

        dirLight.shadow.camera

    );


// scene.add(shadowHelper);


// ============================================================
// 8. OrbitControls
// ============================================================

const controls =
    new OrbitControls(

        camera,
        renderer.domElement

    );


// 滑らかな操作
controls.enableDamping = true;


// damping量
controls.dampingFactor =
    0.05;


// ============================================================
// 9. GLB Loader
// ============================================================

const loader =
    new GLTFLoader();


loader.load(

    // --------------------------------------------------------
    // ★ GLBファイル
    // --------------------------------------------------------

    'model/house.glb',


    // --------------------------------------------------------
    // 読み込み成功
    // --------------------------------------------------------

    function (gltf) {


        console.log(
            'GLB loaded'
        );


        const model =
            gltf.scene;


        // ====================================================
        // 10. GLBのMesh設定
        // ====================================================

        model.traverse(

            function (object) {


                if (
                    object.isMesh
                ) {


                    // ----------------------------------------
                    // ★ 影を落とす
                    // ----------------------------------------

                    object.castShadow = true;


                    // ----------------------------------------
                    // ★ 影を受ける
                    // ----------------------------------------

                    object.receiveShadow = true;


                    // ----------------------------------------
                    // デバッグ
                    // ----------------------------------------

                    console.log(

                        'Mesh:',
                        object.name

                    );


                    if (
                        object.material
                    ) {

                        console.log(

                            'Material:',
                            object.material.name

                        );

                    }

                }

            }

        );


        // ====================================================
        // 11. GLBをSceneへ追加
        // ====================================================

        scene.add(
            model
        );


        // ====================================================
        // 12. GLBの大きさを取得
        // ====================================================

        const box =
            new THREE.Box3()
                .setFromObject(model);


        // 建物サイズ
        const size =
            box.getSize(
                new THREE.Vector3()
            );


        console.log(
            'Model Size:',
            size
        );


        // ====================================================
        // 13. 建物中心
        // ====================================================

        const center =
            box.getCenter(
                new THREE.Vector3()
            );


        console.log(
            'Model Center:',
            center
        );


        // ====================================================
        // 14. Camera自動設定
        // ====================================================

        const maxSize =
            Math.max(

                size.x,
                size.y,
                size.z

            );


        const distance =
            maxSize * 2.0;


        // カメラ位置
        camera.position.set(

            center.x + distance,
            center.y + distance * 0.7,
            center.z + distance

        );


        // ====================================================
        // 15. Camera Near / Far
        // ====================================================

        camera.near =
            maxSize / 1000;


        camera.far =
            maxSize * 100;


        camera.updateProjectionMatrix();


        // ====================================================
        // 16. OrbitControlsの中心
        // ====================================================

        controls.target.copy(
            center
        );


        controls.update();


        // ====================================================
        // 17. DirectionalLightを建物に合わせる
        // ====================================================

        dirLight.target.position.copy(
            center
        );


        // ====================================================
        // 18. Shadow Cameraを建物サイズに合わせる
        // ====================================================

        const shadowSize =
            maxSize * 1.5;


        dirLight.shadow.camera.left =
            -shadowSize;


        dirLight.shadow.camera.right =
            shadowSize;


        dirLight.shadow.camera.top =
            shadowSize;


        dirLight.shadow.camera.bottom =
            -shadowSize;


        dirLight.shadow.camera.far =
            maxSize * 5;


        dirLight.shadow.camera.updateProjectionMatrix();


        // ====================================================
        // 19. Loading表示を消す
        // ====================================================

        document.getElementById(
            'loading'
        ).style.display = 'none';


    },


    // --------------------------------------------------------
    // Loading Progress
    // --------------------------------------------------------

    function (xhr) {


        if (xhr.total > 0) {


            const percent =
                xhr.loaded /
                xhr.total *
                100;


            console.log(

                'Loading:',
                percent.toFixed(1),
                '%'

            );

        }

    },


    // --------------------------------------------------------
    // Error
    // --------------------------------------------------------

    function (error) {


        console.error(
            'GLB Loading Error:',
            error
        );


        document.getElementById(
            'loading'
        ).textContent =
            'GLB Loading Error';


    }

);


// ============================================================
// 20. Window Resize
// ============================================================

window.addEventListener(

    'resize',

    function () {


        camera.aspect =

            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );


    }

);


// ============================================================
// 21. Animation Loop
// ============================================================

function animate() {


    requestAnimationFrame(
        animate
    );


    // OrbitControls
    controls.update();


    // Render
    renderer.render(

        scene,
        camera

    );


}


// ============================================================
// Start
// ============================================================

animate();


</script>


</body>

</html>
```
